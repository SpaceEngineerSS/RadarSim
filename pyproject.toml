[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radarsim"
version = "3.0.0"
description = "Physics-based radar simulation, signal processing, tracking, ECM, and radar imaging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "RadarSim Contributors"}
]
keywords = ["radar", "simulation", "tracking", "ecm", "eccm", "sar", "isar", "kalman-filter", "aerospace", "electronic-warfare"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "numba>=0.59.0",
    "h5py>=3.9.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "matplotlib>=3.7.0",
    "PyOpenGL>=3.1.7",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
all = ["radarsim[gui,dev,docs]"]

[project.urls]
Homepage = "https://github.com/SpaceEngineerSS/RadarSim"
Documentation = "https://github.com/SpaceEngineerSS/RadarSim#readme"
Repository = "https://github.com/SpaceEngineerSS/RadarSim"
Issues = "https://github.com/SpaceEngineerSS/RadarSim/issues"

[project.scripts]
radarsim = "src.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "gui*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

