name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  source-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows_x86_64
            executable: dist/RadarSim.exe
            data_separator: ";"
            gui_option: --windowed
          - os: ubuntu-latest
            platform: Linux_x86_64
            executable: dist/RadarSim
            data_separator: ":"
            gui_option: ""
          - os: macos-latest
            platform: macOS_arm64
            executable: dist/RadarSim
            data_separator: ":"
            gui_option: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[gui]"
      - run: python -m pip install pyinstaller==6.22.2
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean --onefile --name RadarSim --exclude-module torch --exclude-module tensorflow --exclude-module pytest --exclude-module pygame --exclude-module sphinx --exclude-module docutils --add-data "scenarios${{ matrix.data_separator }}scenarios" ${{ matrix.gui_option }} run_gui.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.executable }}', README.md, LICENSE -DestinationPath 'RadarSim_${{ github.ref_name }}_${{ matrix.platform }}.zip'
      - name: Package Unix
        if: runner.os != 'Windows'
        run: tar -czf "RadarSim_${{ github.ref_name }}_${{ matrix.platform }}.tar.gz" "${{ matrix.executable }}" README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: RadarSim_${{ matrix.platform }}
          path: RadarSim_${{ github.ref_name }}_${{ matrix.platform }}.*

  publish:
    needs: [source-distributions, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: RadarSim ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
