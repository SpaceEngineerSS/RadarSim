name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  python-package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  desktop:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[gui,build]"
      - run: python -m PyInstaller --noconfirm --clean RadarSim.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/RadarSim, README.md, LICENSE -DestinationPath "RadarSim-${{ github.ref_name }}-${{ matrix.platform }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "RadarSim-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" -C dist RadarSim
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/RadarSim.app "RadarSim-${{ github.ref_name }}-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: RadarSim-${{ github.ref_name }}-*

  publish:
    needs: [python-package, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS
      - name: Release notes from the changelog
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: RadarSim ${{ github.ref_name }}
          body_path: notes.md
          files: assets/*
          fail_on_unmatched_files: true

  pages:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs gh-deploy --force
