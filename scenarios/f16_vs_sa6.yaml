# F-16 vs SA-6 Air Defence
#
# Two F-16s ingress from the West against an S-band search radar. Alpha carries
# a barrage noise jammer, launches an ADM-160 MALD decoy at t = 30 s and drops a
# chaff cloud at t = 60 s; both are released from Alpha's position at that time.
# The radar uses a 16-cell CA-CFAR, whose CFAR loss is applied to every look.
#
# Coordinates: ENU (x East, y North, z Up), metres.

scenario:
  name: "F-16 vs SA-6 Air Defense"
  description: "Fighters with noise jamming, a MALD decoy and chaff against an S-band search radar"
  duration_seconds: 180
  update_rate_hz: 30

radar:
  name: "Long-range search radar"
  type: "pulse_doppler"
  frequency_hz: 3.0e9
  power_watts: 500000
  prf_hz: 2000
  pulse_width_s: 2.0e-6
  antenna:
    gain_db: 42
    beamwidth_az_deg: 1.2
    beamwidth_el_deg: 1.8
    sidelobe_db: -25
  receiver:
    noise_figure_db: 3.0
    bandwidth_hz: 100.0e6
  position: {x_m: 0, y_m: 0, z_m: 10}

targets:
  - name: "F-16 Alpha"
    type: "fighter"
    rcs_m2: 2.0
    swerling_model: 1
    initial_position: {x_m: -80000, y_m: 10000, z_m: 5000}
    velocity: {vx_mps: 350, vy_mps: -50, vz_mps: -10}
    has_ecm: true
    ecm_type: "noise_barrage"
    ecm_power_watts: 200

  - name: "F-16 Bravo"
    type: "fighter"
    rcs_m2: 2.5
    swerling_model: 1
    initial_position: {x_m: -75000, y_m: -5000, z_m: 6000}
    velocity: {vx_mps: 340, vy_mps: 70, vz_mps: 0}
    has_ecm: false

ecm:
  decoys:
    - name: "ADM-160 MALD"
      deployed_by: "F-16 Alpha"
      deploy_time_s: 30
      velocity: {vx_mps: 300, vy_mps: 30, vz_mps: -5}
      rcs_m2: 5.0  # augmented to mimic a fighter
  chaff_clouds:
    - name: "Chaff 1"
      deployed_by: "F-16 Alpha"
      deploy_time_s: 60
      rcs_m2: 50
      bloom_time_s: 1.0
      decay_time_s: 120

environment:
  temperature_c: 15
  pressure_hpa: 1013.25
  water_vapor_gpm3: 7.5
  terrain_type: "rural"

simulation:
  enable_atmospheric_loss: true
  enable_clutter: true
  pfa: 1.0e-6
  cfar:
    type: "CA"
    guard_cells: 2
    reference_cells: 16
