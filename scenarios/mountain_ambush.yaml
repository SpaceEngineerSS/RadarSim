scenario:
  name: "Mountain Line-of-Sight Test"
  description: "Generic low- and high-altitude targets for terrain-mask experiments"
  duration_seconds: 180
  update_rate_hz: 20
  required_radar_preset: "Surveillance (S-Band)"

radar:
  name: "Ground surveillance radar"
  frequency_hz: 3.0e9
  power_watts: 500000
  prf_hz: 1000
  pulse_width_s: 1.0e-6
  system_losses_db: 5.0
  antenna:
    gain_db: 35
    beamwidth_az_deg: 2.0
    beamwidth_el_deg: 3.0
    polarization_tilt_deg: 0
  receiver:
    noise_figure_db: 4.0
    bandwidth_hz: 1.0e6
    system_temperature_k: 290
    full_scale_dbm: -20
  position: {x_m: 0, y_m: 0, z_m: 100}

targets:
  - name: "Low-altitude target"
    type: "fighter"
    rcs_m2: 5.0
    swerling_model: 1
    initial_position: {x_m: 70000, y_m: 80000, z_m: 300}
    velocity: {vx_mps: -150, vy_mps: -100, vz_mps: 0}
    has_ecm: false
  - name: "High-altitude reference target"
    type: "fighter"
    rcs_m2: 8.0
    swerling_model: 1
    initial_position: {x_m: 80000, y_m: 30000, z_m: 8000}
    velocity: {vx_mps: -150, vy_mps: 100, vz_mps: 0}
    has_ecm: false

environment:
  temperature_c: 15
  pressure_hpa: 1013.25
  water_vapor_gpm3: 7.5
  terrain_type: "mountain"
  sea_state: 0
  rain_rate_mm_hr: 0
  ground_surface:
    model: "gamma"

simulation:
  enable_atmospheric_loss: true
  enable_clutter: true
  pfa: 1.0e-6
  pulses_integrated: 8
