# Ground Clutter Filtering
#
# L-band surveillance radar over mixed terrain. Three clutter sectors override
# the default rural surface; low flyers compete with clutter that enters through
# the elevation beam, the high flyer is clear of it. A two-pulse MTI canceller
# and a greatest-of CFAR are active. Toggle MTI from the Advanced menu to see
# the clutter-limited SNR change.
#
# Coordinates: ENU (x East, y North, z Up); azimuth clockwise from North.

scenario:
  name: "Ground Clutter Filtering"
  description: "Low flyers in sectored land clutter with MTI and GO-CFAR"
  duration_seconds: 60
  update_rate_hz: 30

radar:
  name: "AN/TPS-77 class"
  type: "pulsed"
  frequency_hz: 1.3e9
  power_watts: 500000
  prf_hz: 300
  pulse_width_s: 100.0e-6
  antenna:
    gain_db: 38
    beamwidth_az_deg: 2.4
    beamwidth_el_deg: 3.5
    sidelobe_db: -35
    scan_rate_rpm: 6
  receiver:
    noise_figure_db: 3.5
    bandwidth_hz: 1.0e6
  position: {x_m: 0, y_m: 0, z_m: 30}

targets:
  - name: "Low Flyer 1"
    type: "aircraft"
    rcs_m2: 8.0
    swerling_model: 1
    initial_position: {x_m: 25000, y_m: 15000, z_m: 150}
    velocity: {vx_mps: -80, vy_mps: -40, vz_mps: 0}

  - name: "Low Flyer 2"
    type: "helicopter"
    rcs_m2: 4.0
    swerling_model: 2  # rotor modulation decorrelates pulse to pulse
    initial_position: {x_m: -20000, y_m: 30000, z_m: 50}
    velocity: {vx_mps: 60, vy_mps: -30, vz_mps: 2}

  - name: "High Flyer"
    type: "aircraft"
    rcs_m2: 10.0
    swerling_model: 1
    initial_position: {x_m: 40000, y_m: -20000, z_m: 8000}
    velocity: {vx_mps: 250, vy_mps: 100, vz_mps: 0}

environment:
  temperature_c: 20
  pressure_hpa: 1013.25
  water_vapor_gpm3: 10.0
  rain_rate_mm_hr: 0
  terrain_type: "rural"
  clutter:
    sectors:
      - name: "Urban"
        azimuth_start_deg: 45
        azimuth_end_deg: 90
        range_start_km: 5
        range_end_km: 25
        terrain_type: "urban"
      - name: "Rural"
        azimuth_start_deg: 135
        azimuth_end_deg: 225
        range_start_km: 0
        range_end_km: 50
        terrain_type: "rural"
      - name: "Forest"
        azimuth_start_deg: 270
        azimuth_end_deg: 315
        range_start_km: 10
        range_end_km: 40
        terrain_type: "forest"
        sigma0_adjustment_db: 3

simulation:
  enable_atmospheric_loss: true
  enable_clutter: true
  pfa: 1.0e-6
  cfar:
    type: "GO"
    guard_cells: 3
    reference_cells: 24
  mti:
    enabled: true
    threshold_mps: 10
